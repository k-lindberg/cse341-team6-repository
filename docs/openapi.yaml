
openapi: 3.0.3
info:
  title: Kizuna Rail API
  version: 1.0.0
  description: API documentation for the Kizuna Rail application.

paths:
  /api/trains:
    get:
      summary: Get paginated trains
      description: Returns trains sorted by name in ascending order.
      parameters:
        - name: page
          in: query
          required: false
          description: Page number to retrieve. Must be a positive integer.
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: Successfully retrieved paginated trains.
          content:
            application/json:
              schema:
                type: object
                properties:
                  trains:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  pagination:
                    type: object
                    properties:
                      currentPage:
                        type: integer
                      pageSize:
                        type: integer
                        example: 10
                      totalTrains:
                        type: integer
                      totalPages:
                        type: integer
        '400':
          description: Invalid page number.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Page must be a positive integer.
